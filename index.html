<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Elo — Café Ordering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3E7D3;
    --cream-light:#FBF5EA;
    --paper:#FFFDF9;
    --coffee-900:#2B1B11;
    --coffee-700:#4A3020;
    --coffee-500:#7A5738;
    --coffee-300:#B79A7C;
    --clay:#B0602E;
    --clay-dark:#8E4B22;
    --gold:#C6963E;
    --green:#4C7A4F;
    --green-bg:#E7EFE3;
    --orange:#C97A2A;
    --orange-bg:#FBEBD9;
    --red:#B0392C;
    --red-bg:#F8E4E0;
    --line: rgba(43,27,17,0.12);
    --shadow: 0 8px 24px rgba(43,27,17,0.10), 0 2px 6px rgba(43,27,17,0.06);
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    font-family:'Manrope', sans-serif;
    background:var(--cream);
    color:var(--coffee-900);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    overflow-x:hidden;
  }
  .serif{ font-family:'Fraunces', serif; }

  /* ---------- Desktop ambient shell ---------- */
  .app-shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--cream-light);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow: 0 0 0 1px var(--line);
  }
  @media (min-width:900px){
    body{
      background:
        radial-gradient(circle at 12% 20%, rgba(176,96,46,0.10), transparent 40%),
        radial-gradient(circle at 88% 75%, rgba(198,150,62,0.14), transparent 45%),
        var(--cream);
      padding:48px 24px;
    }
    .app-shell{
      min-height:calc(100vh - 96px);
      border-radius:28px;
      overflow:hidden;
      box-shadow: 0 30px 70px rgba(43,27,17,0.18), 0 0 0 1px var(--line);
    }
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px 14px;
    position:sticky; top:0; z-index:20;
    background:linear-gradient(to bottom, var(--cream-light) 80%, rgba(251,245,234,0));
  }
  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:0.3px;
    color:var(--coffee-900);
    display:flex; align-items:baseline; gap:6px;
  }
  .wordmark small{
    font-family:'Manrope', sans-serif;
    font-weight:600;
    font-size:11px;
    letter-spacing:1.5px;
    color:var(--coffee-500);
  }
  .table-pill{
    font-size:12.5px; font-weight:700;
    color:var(--clay-dark);
    background:#FBEBD9;
    border:1px solid rgba(176,96,46,0.25);
    padding:6px 12px; border-radius:999px;
  }

  /* ---------- Screens ---------- */
  .screen{ display:none; flex:1; flex-direction:column; animation:rise 380ms cubic-bezier(.2,.8,.2,1); }
  .screen.active{ display:flex; }
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  /* ================= WELCOME ================= */
  .hero{
    padding:6px 26px 0;
  }
  .hero-mark{
    width:64px; height:64px; border-radius:20px;
    background:linear-gradient(155deg, var(--clay), var(--clay-dark));
    display:flex; align-items:center; justify-content:center;
    font-size:28px; box-shadow:0 10px 22px rgba(142,75,34,0.35);
    margin-bottom:18px;
  }
  .hero h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:40px;
    line-height:1.05;
    margin:0 0 6px;
    color:var(--coffee-900);
  }
  .hero .tagline{
    font-style:italic;
    font-family:'Fraunces', serif;
    font-size:17px;
    color:var(--coffee-500);
    margin:0 0 22px;
  }
  .welcome-note{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:16px 18px;
    font-size:14.5px;
    line-height:1.5;
    color:var(--coffee-700);
    margin-bottom:26px;
  }
  .welcome-note b{ color:var(--coffee-900); }

  .form-wrap{ padding:0 26px 26px; }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12.5px; font-weight:700;
    color:var(--coffee-700); margin-bottom:7px; letter-spacing:.2px;
  }
  .field input{
    width:100%;
    padding:14px 15px;
    font-size:16px;
    font-family:'Manrope', sans-serif;
    border-radius:var(--radius-sm);
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--coffee-900);
    outline:none;
    transition:border-color 160ms ease, box-shadow 160ms ease;
  }
  .field input::placeholder{ color:#B7A88F; }
  .field input:focus{
    border-color:var(--clay);
    box-shadow:0 0 0 3px rgba(176,96,46,0.14);
  }
  .field input.err{ border-color:var(--red); }
  .field .msg{
    min-height:16px;
    font-size:12.5px;
    color:var(--red);
    margin-top:5px;
  }

  .btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
    padding:15px 18px;
    font-size:15.5px;
    font-weight:700;
    font-family:'Manrope', sans-serif;
    border:none; border-radius:14px;
    cursor:pointer;
    transition:transform 120ms ease, box-shadow 120ms ease, opacity 120ms ease;
    -webkit-user-select:none; user-select:none;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:linear-gradient(155deg, var(--clay), var(--clay-dark));
    color:#FBF2E7;
    box-shadow:0 10px 22px rgba(142,75,34,0.32);
  }
  .btn-primary:disabled{ opacity:0.5; box-shadow:none; cursor:default; }
  .btn-ghost{
    background:transparent;
    color:var(--coffee-700);
    border:1.5px solid var(--line);
  }
  .btn-dark{
    background:var(--coffee-900);
    color:var(--cream-light);
  }

  /* ================= MENU ================= */
  .menu-head{ padding:2px 22px 6px; }
  .menu-head h2{ font-family:'Fraunces', serif; font-size:26px; margin:0 0 2px; }
  .menu-head p{ margin:0; font-size:13.5px; color:var(--coffee-500); font-style:italic; font-family:'Fraunces', serif;}

  .cat-nav{
    display:flex; gap:8px; padding:16px 22px 8px;
    overflow-x:auto; scrollbar-width:none; position:sticky; top:70px; z-index:15;
    background:var(--cream-light);
  }
  .cat-nav::-webkit-scrollbar{ display:none; }
  .cat-chip{
    flex:0 0 auto;
    padding:9px 16px;
    border-radius:999px;
    font-size:13.5px; font-weight:700;
    background:var(--paper);
    border:1.5px solid var(--line);
    color:var(--coffee-700);
    cursor:pointer;
    white-space:nowrap;
    transition:all 150ms ease;
  }
  .cat-chip.active{
    background:var(--coffee-900);
    color:var(--cream-light);
    border-color:var(--coffee-900);
  }

  .menu-list{ padding:6px 18px 120px; }
  .cat-section{ margin-top:22px; }
  .cat-title{
    font-family:'Fraunces', serif;
    font-size:19px; font-weight:600;
    margin:0 0 12px 4px;
    color:var(--coffee-900);
  }
  .item-card{
    display:flex; gap:14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius-md);
    padding:14px;
    margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .item-thumb{
    width:64px; height:64px; border-radius:14px;
    flex:0 0 64px;
    display:flex; align-items:center; justify-content:center;
    font-size:26px;
    background:linear-gradient(155deg, #EFDCC0, #E3C79E);
  }
  .item-info{ flex:1; min-width:0; }
  .item-info h4{
    margin:0 0 3px; font-size:15.5px; font-weight:700; color:var(--coffee-900);
  }
  .item-info p{
    margin:0 0 8px; font-size:12.5px; color:var(--coffee-500); line-height:1.35;
  }
  .item-bottom{ display:flex; align-items:center; justify-content:space-between; }
  .item-price{ font-weight:800; font-size:14.5px; color:var(--clay-dark); }
  .add-btn{
    border:none; border-radius:10px;
    background:var(--coffee-900); color:var(--cream-light);
    font-size:13px; font-weight:700;
    padding:8px 14px;
    cursor:pointer;
    transition:transform 120ms ease;
  }
  .add-btn:active{ transform:scale(0.94); }
  .stepper{
    display:flex; align-items:center; gap:10px;
    background:var(--coffee-900); border-radius:10px; padding:4px 6px;
  }
  .stepper button{
    width:24px; height:24px; border-radius:6px; border:none;
    background:rgba(255,255,255,0.14); color:var(--cream-light);
    font-size:15px; font-weight:700; cursor:pointer; line-height:1;
  }
  .stepper span{ color:var(--cream-light); font-size:13.5px; font-weight:700; min-width:14px; text-align:center; }

  .cart-bar{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:0; width:100%; max-width:480px;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:var(--coffee-900);
    display:none; align-items:center; justify-content:space-between;
    gap:14px; z-index:30;
    box-shadow:0 -8px 24px rgba(43,27,17,0.28);
  }
  .cart-bar.show{ display:flex; }
  .cart-bar .cb-left{ color:var(--cream-light); }
  .cart-bar .cb-left .n{ font-size:12px; opacity:0.75; }
  .cart-bar .cb-left .p{ font-size:17px; font-weight:800; font-family:'Fraunces', serif; }
  .cart-bar button{
    border:none; border-radius:12px; padding:12px 20px;
    background:var(--clay); color:#FBF2E7; font-weight:700; font-size:14.5px;
    cursor:pointer;
  }

  /* ================= CART DRAWER ================= */
  .overlay{
    position:fixed; inset:0; background:rgba(43,27,17,0.45);
    z-index:40; display:none; opacity:0; transition:opacity 220ms ease;
  }
  .overlay.show{ display:block; opacity:1; }
  .drawer{
    position:fixed; left:50%; transform:translate(-50%, 100%);
    bottom:0; width:100%; max-width:480px; max-height:85vh;
    background:var(--cream-light);
    border-radius:24px 24px 0 0;
    z-index:41; transition:transform 300ms cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
    box-shadow:0 -10px 40px rgba(43,27,17,0.3);
  }
  .drawer.show{ transform:translate(-50%, 0); }
  .drawer-handle{ width:40px; height:4px; background:var(--coffee-300); border-radius:99px; margin:12px auto 4px; }
  .drawer-head{ padding:8px 22px 14px; display:flex; align-items:center; justify-content:space-between; }
  .drawer-head h3{ font-family:'Fraunces', serif; font-size:21px; margin:0; }
  .drawer-close{ border:none; background:var(--paper); border:1px solid var(--line); width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:15px; color:var(--coffee-700); }
  .drawer-body{ flex:1; overflow-y:auto; padding:0 22px 12px; }
  .cart-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .cart-row .ci-name{ font-size:14.5px; font-weight:700; color:var(--coffee-900); }
  .cart-row .ci-price{ font-size:12.5px; color:var(--coffee-500); margin-top:2px; }
  .cart-row .ci-remove{ background:none; border:none; color:var(--red); font-size:12px; font-weight:700; cursor:pointer; margin-top:4px; padding:0; }
  .empty-cart{ text-align:center; padding:50px 20px; color:var(--coffee-500); }
  .empty-cart .em-ic{ font-size:40px; margin-bottom:10px; }
  .drawer-foot{ padding:16px 22px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--cream-light); }
  .subtotal-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:14px; }
  .subtotal-row .lbl{ font-size:13.5px; color:var(--coffee-500); }
  .subtotal-row .amt{ font-family:'Fraunces', serif; font-size:24px; font-weight:600; color:var(--coffee-900); }

  /* ================= CAPTCHA MODAL ================= */
  .modal{
    position:fixed; inset:0; z-index:50; display:none;
    align-items:center; justify-content:center; padding:20px;
    background:rgba(43,27,17,0.55);
  }
  .modal.show{ display:flex; }
  .modal-card{
    width:100%; max-width:380px;
    background:var(--paper); border-radius:24px;
    padding:28px 24px 24px;
    box-shadow:0 30px 60px rgba(0,0,0,0.3);
    animation:pop 260ms cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pop{ from{opacity:0; transform:scale(.92);} to{opacity:1; transform:scale(1);} }
  .modal-card h3{ font-family:'Fraunces', serif; font-size:22px; margin:0 0 6px; }
  .modal-card .sub{ font-size:13.5px; color:var(--coffee-500); line-height:1.5; margin-bottom:20px; }
  .captcha-box{
    background:var(--coffee-900);
    border-radius:14px;
    padding:18px;
    text-align:center;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .captcha-box .noise{
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 6px);
  }
  .captcha-text{
    font-family:'Fraunces', serif;
    font-size:30px; font-weight:700; letter-spacing:8px;
    color:#F1D9B0;
    position:relative;
    text-decoration:line-through;
    text-decoration-color:rgba(241,217,176,0.35);
    transform:skewX(-4deg);
  }
  .captcha-refresh{
    position:absolute; top:10px; right:10px;
    background:rgba(255,255,255,0.12); border:none; color:#F1D9B0;
    width:26px; height:26px; border-radius:8px; cursor:pointer; font-size:13px;
  }
  .captcha-err{ color:var(--red); font-size:12.5px; min-height:16px; margin:8px 0 4px; text-align:center; }

  /* ================= CONFIRMATION ================= */
  .confirm-wrap{ padding:30px 26px 40px; text-align:center; flex:1; display:flex; flex-direction:column; }
  .confirm-badge{
    width:78px; height:78px; border-radius:50%;
    background:var(--green-bg); color:var(--green);
    display:flex; align-items:center; justify-content:center;
    font-size:36px; margin:10px auto 18px;
    animation:pop 420ms cubic-bezier(.2,.8,.2,1);
  }
  .confirm-wrap h1{ font-family:'Fraunces', serif; font-size:27px; margin:0 0 6px; }
  .confirm-wrap .sub1{ font-size:15px; color:var(--coffee-700); margin:0 0 2px; }
  .confirm-wrap .sub2{ font-size:13.5px; color:var(--coffee-500); margin:0 0 24px; }
  .order-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:20px; text-align:left; box-shadow:var(--shadow); margin-bottom:18px;
  }
  .order-card .oc-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .order-card .oc-id{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; }
  .status-tag{ font-size:11.5px; font-weight:800; padding:5px 11px; border-radius:999px; }
  .status-received{ background:var(--green-bg); color:var(--green); }
  .status-new{ background:var(--orange-bg); color:var(--orange); }
  .status-preparing{ background:#FDF1D6; color:#96701A; }
  .status-ready{ background:var(--green-bg); color:var(--green); }
  .oc-item{ display:flex; justify-content:space-between; font-size:14px; color:var(--coffee-700); padding:5px 0; }
  .oc-total{ display:flex; justify-content:space-between; align-items:center; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .oc-total b{ font-family:'Fraunces', serif; font-size:19px; color:var(--coffee-900); }
  .relax-note{ font-size:13.5px; color:var(--coffee-500); font-style:italic; font-family:'Fraunces', serif; margin-bottom:24px; }

  /* ================= DASHBOARD ================= */
  .dash-shell{ background:var(--cream-light); flex:1; display:flex; flex-direction:column; }
  .dash-head{ padding:20px 22px 14px; display:flex; align-items:center; justify-content:space-between; }
  .dash-head h2{ font-family:'Fraunces', serif; font-size:22px; margin:0; }
  .dash-head span{ font-size:12px; color:var(--coffee-500); }
  .dash-list{ padding:4px 18px 40px; overflow-y:auto; }
  .dash-card{
    background:var(--paper); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:16px; margin-bottom:14px; box-shadow:var(--shadow);
  }
  .dash-card.is-ready{ opacity:0.75; }
  .dash-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .dash-id{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; }
  .dash-meta{ font-size:12.5px; color:var(--coffee-500); margin-top:3px; }
  .dash-items{ margin:10px 0; padding:10px 0; border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); }
  .dash-items div{ font-size:13.5px; color:var(--coffee-700); padding:2px 0; }
  .dash-total{ display:flex; justify-content:space-between; align-items:center; margin:10px 0 12px; }
  .dash-total b{ font-family:'Fraunces', serif; font-size:16.5px; }
  .dash-actions{ display:flex; gap:8px; }
  .dash-actions button{
    flex:1; padding:10px 6px; font-size:12px; font-weight:700;
    border-radius:10px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--coffee-700); cursor:pointer;
    transition:all 140ms ease;
  }
  .dash-actions button.step-active{
    background:var(--coffee-900); color:var(--cream-light); border-color:var(--coffee-900);
  }
  .dash-actions button:disabled{ opacity:0.4; cursor:default; }
  .dash-empty{ text-align:center; padding:60px 20px; color:var(--coffee-500); }

  .demo-link{
    position:fixed; top:14px; right:14px; z-index:60;
    font-size:11px; font-weight:700; letter-spacing:.3px;
    background:var(--coffee-900); color:var(--cream-light);
    padding:8px 12px; border-radius:999px; border:none; cursor:pointer;
    box-shadow:0 6px 16px rgba(0,0,0,0.25);
    opacity:0.92;
  }
  @media (min-width:900px){ .demo-link{ right:calc(50% - 220px); } }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%) translateY(10px);
    bottom:26px; z-index:70;
    background:var(--coffee-900); color:var(--cream-light);
    padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600;
    opacity:0; pointer-events:none; transition:all 220ms ease;
    box-shadow:0 10px 24px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<button class="demo-link" onclick="goToDashboard()">Demo Dashboard →</button>

<div class="app-shell" id="appShell">

  <div class="topbar" id="topbar">
    <div class="wordmark">Elo <small>CAFÉ</small></div>
    <div class="table-pill" id="tablePill" style="display:none;"></div>
  </div>

  <!-- ============ SCREEN 1: WELCOME ============ -->
  <section class="screen active" id="screen-welcome">
    <div class="hero">
      <div class="hero-mark">☕</div>
      <h1>Elo</h1>
      <p class="tagline">Scan. Order. Enjoy.</p>
      <div class="welcome-note">
        <b>Welcome to Elo Café ☕</b><br/>
        Order your favourites directly from your table.
      </div>
    </div>
    <div class="form-wrap">
      <div class="field">
        <label>Full Name</label>
        <input type="text" id="inpName" placeholder="e.g. Rahul Sharma" />
        <div class="msg" id="msgName"></div>
      </div>
      <div class="field">
        <label>Table Number</label>
        <input type="text" id="inpTable" placeholder="e.g. 7" inputmode="numeric" />
        <div class="msg" id="msgTable"></div>
      </div>
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" id="inpPhone" placeholder="10-digit mobile number" inputmode="numeric" maxlength="10" />
        <div class="msg" id="msgPhone"></div>
      </div>
      <button class="btn btn-primary" onclick="submitDetails()">Continue to Menu →</button>
    </div>
  </section>

  <!-- ============ SCREEN 2: MENU ============ -->
  <section class="screen" id="screen-menu">
    <div class="menu-head">
      <h2>Elo Café</h2>
      <p>Good food. Good coffee. Good moments.</p>
    </div>
    <div class="cat-nav" id="catNav"></div>
    <div class="menu-list" id="menuList"></div>
    <div class="cart-bar" id="cartBar">
      <div class="cb-left">
        <div class="n" id="cartBarCount">0 items</div>
        <div clas
